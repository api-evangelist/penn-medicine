name: Penn Medicine
description: >
  Penn Medicine is the University of Pennsylvania Health System (UPHS) plus the Perelman School of Medicine. It is an
  $11.9 billion enterprise powered by nearly 49,000 faculty and staff, operating six hospitals (Hospital of the
  University of Pennsylvania, Penn Presbyterian Medical Center, Chester County Hospital, Lancaster General Health,
  Princeton Health, and Pennsylvania Hospital — the first hospital in the United States, chartered in 1751) plus Penn
  Medicine at Home, Good Shepherd Penn Partners Rehabilitation, Lancaster Behavioral Health Hospital, and Princeton
  House Behavioral Health. The Perelman School of Medicine was awarded $580 million in NIH funding in fiscal year 2023.


  From an API perspective, Penn Medicine runs a production Epic-backed HL7 FHIR R4 endpoint at
  `https://ssproxy.pennhealth.com/PRD-FHIR/api/FHIR/R4` (Epic Organization ID 346, implementation description
  "University of Pennsylvania Health Systems FHIR Server"). The CapabilityStatement instantiates `us-core-server|6.1.0`
  and the HL7 Bulk Data Access IG, exposes 59 FHIR resource types covering Patient Access (clinical + claims) and
  Provider Directory per CMS-9115-F, and protects them with OAuth 2.0 / SMART-on-FHIR. Penn Medicine also operates the
  MyPennMedicine MyChart patient portal and the PhysicianLink referring-provider portal, and publishes open-source
  informatics work through several Perelman School of Medicine GitHub orgs (Penn-Medicine-CHCI, pennsignals, PMACS,
  pennbiobank).
